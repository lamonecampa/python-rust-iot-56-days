name: Deploy Visual Lab to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "visual-lab/**"
      - ".github/workflows/deploy-visual-lab.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload Visual Lab artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: visual-lab

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
